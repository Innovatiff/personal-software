<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passive Asset Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app">
    <div id="loading-screen" class="loading-screen">
      <div class="loading-logo">
        <svg width="30" height="30" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="8.5" fill="url(#loadGrad)"/>
          <path d="M16 7.5l7 4-7 4-7-4 7-4Z" fill="#fff" fill-opacity="0.95"/>
          <path d="M9 16l7 4 7-4" stroke="#fff" stroke-opacity="0.65" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9 20l7 4 7-4" stroke="#fff" stroke-opacity="0.4" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="loadGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
              <stop stop-color="#8b7cff"/>
              <stop offset="1" stop-color="#6d5cf0"/>
            </linearGradient>
          </defs>
        </svg>
        <span>Passive Asset Portfolio</span>
      </div>
      <div class="loading-spinner"></div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
